name: Fix site icon imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure lucide imports are complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/site.tsx')
          text = path.read_text()
          marker = "  CircleHelp,\n"
          if '  CircleDollarSign,\n' not in text:
              text = text.replace(marker, "  CircleDollarSign,\n" + marker, 1)
              path.write_text(text)
          PY

      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No import fix needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/site.tsx
          git commit -m "fix: add missing CircleDollarSign import"
          git push